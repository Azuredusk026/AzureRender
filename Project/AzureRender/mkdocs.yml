site_name: AzureRender
site_description: 原生 Vulkan 可扩展实时渲染器技术文档
site_url: https://azuredusk026.github.io/AzureRender/
repo_url: https://github.com/Azuredusk026/AzureRender
repo_name: Azuredusk026/AzureRender

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

