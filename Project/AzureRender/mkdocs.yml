site_name: AzureRender
site_description: 原生 Vulkan 可扩展实时渲染器技术文档
site_url: https://azuredusk026.github.io/AzureRender/
repo_url: https://github.com/Azuredusk026/AzureRender
repo_name: Azuredusk026/AzureRender

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 项目总览: index.md
  - 构建与使用: getting-started.md
  - 渲染器架构: architecture.md
  - 角色渲染: character-rendering.md
  - 黑洞模拟: blackhole-rendering.md
  - 资产与编辑器: assets-and-editor.md
  - 开发、测试与发布: development-and-release.md
  - 参数与接口参考: reference.md
  - 开发规范: documentation-standard.md
  - 计划:
      - Azure Engine 总计划: plans/azure-engine-plan.md
      - 渲染核心实施计划: plans/render-core-implementation.md
  - 运行时:
      - 渲染图: runtime/render-graph.md
      - RHI 同步: runtime/rhi-synchronization.md
      - 场景数据: runtime/scene-data.md
      - Compute Pass: runtime/compute-passes.md
      - 并行录制与 GPU 提交: runtime/parallel-submission.md
      - Windows 渲染核心验收: runtime/windows-acceptance.md
      - 环境资源: runtime/environment-assets.md
      - 聚簇光照: runtime/clustered-lighting.md
  - 阶段验收:
      - 桌面同步: acceptance/r1/2026-09-26.md
      - R2 验收: acceptance/r2/2026-09-26.md
      - R3 验收: acceptance/r3/2026-10-03.md
      - R3 历史审查: acceptance/r3/2026-10-01.md
      - R4 验收: acceptance/r4/2026-10-03.md
      - 审计修复跟踪: audits/2026-10-01-follow-up.md
      - G0 起始记录: acceptance/r0/2026-09-26.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

exclude_docs: |
  archive/
  **/*_CN.md

copyright: Copyright &copy; 2026 AzureRender contributors
