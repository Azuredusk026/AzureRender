name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "Project/AzureRender/README.md"
      - "Project/AzureRender/docs/**"
      - "Project/AzureRender/mkdocs.yml"
      - "Project/AzureRender/requirements-docs.txt"
      - "Project/AzureRender/tools/check_docs.sh"
      - "Project/AzureRender/tools/check_doc_style.py"
      - ".github/workflows/documentation.yml"
  pull_request:
    paths:
      - "README.md"
      - "Project/AzureRender/README.md"
      - "Project/AzureRender/docs/**"
      - "Project/AzureRender/mkdocs.yml"
      - "Project/AzureRender/requirements-docs.txt"
      - "Project/AzureRender/tools/check_docs.sh"
      - "Project/AzureRender/tools/check_doc_style.py"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Project/AzureRender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Project/AzureRender/requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: bash tools/check_docs.sh
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: Project/AzureRender/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
